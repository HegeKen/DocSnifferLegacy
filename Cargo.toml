[package]
name = "docsniffer-legacy"
version = "1.0.0"
edition = "2021"
description = "DocSniffer Legacy Edition - 针对 Windows 低版本系统(2000/XP/Vista/7)的轻量级敏感文件嗅探工具"
authors = ["DocSniffer Team"]

# 目标：单文件 .exe，无运行时依赖。Windows 工具链见 .cargo/config.toml
[lib]
name = "docsniffer_legacy"
path = "src/lib.rs"

[[bin]]
name = "docsniffer_legacy"
path = "src/main.rs"

[dependencies]
# ---- GUI（即时模式，无浏览器内核）----
eframe = "0.28"
egui_extras = "0.28"
rfd = "0.15"

# ---- 全文检索引擎 ----
tantivy = "0.22"
jieba-rs = "0.7"

# ---- 中文文本编码 / 检测 ----
encoding_rs = "0.8"
chardetng = "0.1"

# ---- 文件扫描 / 多线程调度 ----
walkdir = "2"
rayon = "1"
crossbeam-channel = "0.5"

# ---- 内容提取 ----
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

# ---- 敏感信息匹配 ----
regex = "1"

# ---- 序列化 / 配置 / 报告 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = "0.4"
once_cell = "1"
dirs = "5"

# ---- 常用工具 ----
log = "0.4"

[profile.release]
opt-level = "z"      # 优化体积，面向单文件 exe
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
